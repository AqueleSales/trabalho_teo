    </div>
</section>

{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const resposta = await fetch('/api/redes-apoio-df');
            const redes = await resposta.json();
            const container = document.getElementById('lista-redes');
            container.innerHTML = '';

            redes.forEach(rede => {
                const especialidadesHTML = rede.especialidades.map(esp =>
                    `<span style="background: #e2e8f0; color: #475569; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; margin-right: 5px; display: inline-block; margin-bottom: 5px;">${esp}</span>`
                ).join('');

                const tipoBadge = rede.tipo === 'ong'
                    ? `<span style="background: #fdf2f8; color: #db2777; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold;">ONG/Apoio</span>`
                    : `<span style="background: #eff6ff; color: #2563eb; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold;">SUS/Hospital</span>`;

                container.innerHTML += `
                    <div style="border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; background: white; display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: start; justify-content: space-between;">
                        <div style="flex: 1; min-width: 250px;">
                            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 0.5rem;">
                                <h3 style="color: var(--primary-dark); margin: 0;">${rede.nome}</h3>
                                ${tipoBadge}
                            </div>
                            <p style="color: var(--gray-600); margin-bottom: 0.5rem;">📍 ${rede.endereco}</p>
                            <p style="color: var(--gray-600); margin-bottom: 1rem;">📞 ${rede.telefone}</p>
                            <div>${especialidadesHTML}</div>
                        </div>
                    </div>
                `;
            });
        } catch (error) {
            document.getElementById('lista-redes').innerHTML = '<div style="color: red; text-align: center;">Erro ao carregar dados.</div>';
        }
    });
</script>
{% endblock %}
